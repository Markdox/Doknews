<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sky TG24 • Edizione del Giorno</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sky TG24">
  <meta name="theme-color" content="#f9f8f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1585829365295-ab7cd400c167?auto=format&fit=crop&w=180&q=80">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --bg: #f9f8f6;
      --card-bg: #ffffff;
      --text-main: #1c1917;
      --text-muted: #78716c;
      --border: #e7e5e4;
      --accent: #0284c7;
      --serif: 'Newsreader', Georgia, serif;
      --sans: 'Inter', -apple-system, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413;
        --card-bg: #1c1b1a;
        --text-main: #f5f5f4;
        --text-muted: #a8a29e;
        --border: #292524;
        --accent: #38bdf8;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px 64px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Testata Editoriale */
    header {
      border-bottom: 2px solid var(--text-main);
      padding-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .header-info .edition {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
      color: var(--text-muted);
      display: block;
      margin-bottom: 2px;
    }

    .header-info h1 {
      font-family: var(--serif);
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.5px;
    }

    .refresh-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s ease;
      margin-bottom: 4px;
    }

    .refresh-btn:hover {
      background: var(--card-bg);
      border-color: var(--text-muted);
    }

    .refresh-btn.spinning i {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    #news-container {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Notizia Principale (Hero) */
    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .hero-card:hover {
      border-color: var(--text-muted);
      transform: translateY(-2px);
    }

    .hero-img-wrap {
      width: 100%;
      height: 220px;
      background-color: var(--border);
      position: relative;
    }

    .hero-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-tag {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--text-main);
      color: var(--bg);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .hero-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hero-title {
      font-family: var(--serif);
      font-size: 1.45rem;
      line-height: 1.25;
      font-weight: 600;
    }

    .meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Lista Altre Notizie */
    .list-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      text-decoration: none;
      color: inherit;
      display: grid;
      grid-template-columns: 24px 1fr 76px;
      gap: 14px;
      align-items: center;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .list-card:hover {
      border-color: var(--text-muted);
      transform: translateY(-1px);
    }

    .rank-num {
      font-family: var(--serif);
      font-size: 1.25rem;
      font-style: italic;
      color: var(--text-muted);
      font-weight: 600;
      text-align: center;
    }

    .list-title {
      font-family: var(--serif);
      font-size: 1.05rem;
      line-height: 1.3;
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .list-thumb {
      width: 76px;
      height: 64px;
      border-radius: 6px;
      object-fit: cover;
      background-color: var(--border);
    }

    /* Skeleton Loading */
    .skeleton-hero {
      height: 280px;
      background: var(--border);
      border-radius: 12px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .skeleton-item {
      height: 80px;
      background: var(--border);
      border-radius: 10px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <main class="container">
    <header>
      <div class="header-info">
        <span class="edition" id="today-date">OGGI</span>
        <h1>Sky TG24</h1>
      </div>
      <button class="refresh-btn" id="refresh-btn" aria-label="Aggiorna">
        <i class="ph ph-arrows-clockwise"></i>
      </button>
    </header>

    <section id="news-container">
      <div class="skeleton-hero"></div>
      <div class="skeleton-item"></div>
      <div class="skeleton-item"></div>
      <div class="skeleton-item"></div>
      <div class="skeleton-item"></div>
    </section>
  </main>

  <script>
    const fallbackThumbnails = [
      'https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=800&q=80',
      'https://images.unsplash.com/photo-1585829365295-ab7cd400c167?auto=format&fit=crop&w=800&q=80',
      'https://images.unsplash.com/photo-1495020689067-958852a7765e?auto=format&fit=crop&w=800&q=80',
      'https://images.unsplash.com/photo-1526470608268-f674ce90ebd4?auto=format&fit=crop&w=800&q=80',
      'https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=800&q=80'
    ];

    function setDate() {
      const opts = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('today-date').textContent = new Date().toLocaleDateString('it-IT', opts);
    }

    function timeAgo(dateString) {
      if (!dateString) return 'Poco fa';
      const past = new Date(dateString);
      const diffMins = Math.floor((new Date() - past) / 60000);
      if (isNaN(diffMins) || diffMins < 1) return 'Adesso';
      if (diffMins < 60) return `${diffMins} min fa`;
      const hours = Math.floor(diffMins / 60);
      return hours < 24 ? `${hours} ore fa` : `${Math.floor(hours / 24)} gg fa`;
    }

    function cleanTitle(rawTitle) {
      return rawTitle.replace(/\s*-\s*Sky TG24.*$/i, '').replace(/ - TG24$/i, '').trim();
    }

    async function fetchSkyNews() {
      const timestamp = Date.now();
      const targetRss = `https://news.google.com/rss/search?q=site:tg24.sky.it&hl=it&gl=IT&ceid=IT:it&_nocache=${timestamp}`;
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(targetRss)}&api_key=&_t=${timestamp}`;

      const res = await fetch(apiUrl, { cache: 'no-store' });
      const data = await res.json();

      if (data.status === 'ok' && data.items && data.items.length > 0) {
        return data.items.slice(0, 5);
      }
      throw new Error('Dati non disponibili');
    }

    async function loadNews() {
      const container = document.getElementById('news-container');
      const btn = document.getElementById('refresh-btn');
      btn.classList.add('spinning');

      container.innerHTML = `
        <div class="skeleton-hero"></div>
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
      `;

      try {
        const items = await fetchSkyNews();
        container.innerHTML = '';

        items.forEach((item, index) => {
          const title = cleanTitle(item.title);
          const link = item.link;
          const time = timeAgo(item.pubDate);
          const imgUrl = (item.enclosure && item.enclosure.link) ? item.enclosure.link : fallbackThumbnails[index % fallbackThumbnails.length];

          if (index === 0) {
            const hero = document.createElement('a');
            hero.href = link;
            hero.target = '_blank';
            hero.rel = 'noopener noreferrer';
            hero.className = 'hero-card';
            hero.innerHTML = `
              <div class="hero-img-wrap">
                <img src="${imgUrl}" alt="Immagine copertina" loading="lazy">
                <span class="hero-tag">In primo piano</span>
              </div>
              <div class="hero-body">
                <span class="meta">${time}</span>
                <h2 class="hero-title">${title}</h2>
              </div>
            `;
            container.appendChild(hero);
          } else {
            const card = document.createElement('a');
            card.href = link;
            card.target = '_blank';
            card.rel = 'noopener noreferrer';
            card.className = 'list-card';
            card.innerHTML = `
              <span class="rank-num">${index + 1}</span>
              <div>
                <h3 class="list-title">${title}</h3>
                <span class="meta">${time}</span>
              </div>
              <img src="${imgUrl}" alt="Thumb" class="list-thumb" loading="lazy">
            `;
            container.appendChild(card);
          }
        });

      } catch (err) {
        console.error(err);
        container.innerHTML = `
          <div style="text-align: center; padding: 40px 16px; border: 1px dashed var(--border); border-radius: 12px;">
            <p style="font-family: var(--serif); font-size: 1.2rem; margin-bottom: 6px;">Nessuna notizia disponibile</p>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">Non è stato possibile caricare gli ultimi aggiornamenti.</p>
            <button onclick="loadNews()" style="background: var(--text-main); color: var(--bg); border: none; padding: 6px 14px; border-radius: 6px; font-size: 0.8rem; cursor: pointer;">Riprova</button>
          </div>
        `;
      } finally {
        btn.classList.remove('spinning');
      }
    }

    document.getElementById('refresh-btn').addEventListener('click', loadNews);
    setDate();
    loadNews();
  </script>
</body>
</html>
